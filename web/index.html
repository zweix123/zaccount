<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAccount - 记账系统</title>

    <!-- Amis CSS -->
    <link rel="stylesheet" href="https://unpkg.com/amis@6.6.0/sdk/sdk.css" />
    <link rel="stylesheet" href="https://unpkg.com/amis@6.6.0/sdk/helper.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .app-container {
            min-height: 100vh;
            background: #f5f5f5;
        }
    </style>
</head>

<body>
    <div id="root" class="app-container"></div>

    <!-- React and ReactDOM (required by Amis) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Amis JS -->
    <script src="https://unpkg.com/amis@6.6.0/sdk/sdk.js"></script>
    <!-- ECharts JS -->
    <script src="https://unpkg.com/echarts@5.4.3/dist/echarts.min.js"></script>

    <script>
        // 创建 ECharts 图表辅助函数
        function createChart(containerId, option) {
            const chartDom = document.getElementById(containerId);
            if (!chartDom) return null;
            const myChart = echarts.init(chartDom);
            myChart.setOption(option);
            // 响应式调整
            window.addEventListener('resize', () => {
                myChart.resize();
            });
            return myChart;
        }

        // 初始化所有图表
        function initCharts() {
            // 收支趋势图
            setTimeout(() => {
                const trendChart = createChart('chart-trend', {
                    title: {
                        text: '收支趋势',
                        left: 'center'
                    },
                    tooltip: {
                        trigger: 'axis'
                    },
                    legend: {
                        data: ['支出', '收入'],
                        top: 30
                    },
                    xAxis: {
                        type: 'category',
                        data: ['1月', '2月', '3月', '4月', '5月', '6月']
                    },
                    yAxis: {
                        type: 'value'
                    },
                    series: [
                        {
                            name: '支出',
                            type: 'line',
                            data: [1200, 1500, 1800, 2000, 2200, 2500],
                            itemStyle: { color: '#1890ff' }
                        },
                        {
                            name: '收入',
                            type: 'line',
                            data: [800, 1000, 1200, 1500, 1800, 2000],
                            itemStyle: { color: '#52c41a' }
                        }
                    ]
                });
            }, 300);

            // 支出分类饼图
            setTimeout(() => {
                createChart('chart-expense', {
                    title: {
                        text: '支出分类',
                        left: 'center'
                    },
                    tooltip: {
                        trigger: 'item',
                        formatter: '{a} <br/>{b}: ¥{c} ({d}%)'
                    },
                    legend: {
                        orient: 'vertical',
                        left: 'left',
                        top: 50
                    },
                    series: [
                        {
                            name: '支出分类',
                            type: 'pie',
                            radius: '50%',
                            data: [
                                { value: 335, name: '餐饮' },
                                { value: 310, name: '交通' },
                                { value: 234, name: '购物' },
                                { value: 135, name: '娱乐' },
                                { value: 154, name: '其他' }
                            ],
                            emphasis: {
                                itemStyle: {
                                    shadowBlur: 10,
                                    shadowOffsetX: 0,
                                    shadowColor: 'rgba(0, 0, 0, 0.5)'
                                }
                            }
                        }
                    ]
                });
            }, 300);

            // 收入分类饼图
            setTimeout(() => {
                createChart('chart-income', {
                    title: {
                        text: '收入分类',
                        left: 'center'
                    },
                    tooltip: {
                        trigger: 'item',
                        formatter: '{a} <br/>{b}: ¥{c} ({d}%)'
                    },
                    legend: {
                        orient: 'vertical',
                        left: 'left',
                        top: 50
                    },
                    series: [
                        {
                            name: '收入分类',
                            type: 'pie',
                            radius: '50%',
                            data: [
                                { value: 500, name: '工资' },
                                { value: 200, name: '投资' },
                                { value: 150, name: '其他' }
                            ],
                            emphasis: {
                                itemStyle: {
                                    shadowBlur: 10,
                                    shadowOffsetX: 0,
                                    shadowColor: 'rgba(0, 0, 0, 0.5)'
                                }
                            }
                        }
                    ]
                });
            }, 300);

            // 月度支出柱状图
            setTimeout(() => {
                createChart('chart-bar', {
                    title: {
                        text: '月度支出对比',
                        left: 'center'
                    },
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: {
                            type: 'shadow'
                        }
                    },
                    xAxis: {
                        type: 'category',
                        data: ['1月', '2月', '3月', '4月', '5月', '6月']
                    },
                    yAxis: {
                        type: 'value'
                    },
                    series: [
                        {
                            name: '支出',
                            type: 'bar',
                            data: [1200, 1500, 1800, 2000, 2200, 2500],
                            itemStyle: { color: '#1890ff' }
                        }
                    ]
                });
            }, 300);
        }

        // 等待 Amis 加载完成
        function initApp() {
            // SDK 版本使用 amisRequire
            let amisEmbed;
            if (typeof amisRequire !== 'undefined') {
                amisEmbed = amisRequire('amis/embed');
            } else if (typeof amis !== 'undefined') {
                amisEmbed = amis;
            } else {
                setTimeout(initApp, 100);
                return;
            }

            amisEmbed.embed('#root', {
                type: 'page',
                title: 'ZAccount - 记账系统',
                body: [
                    {
                        type: 'tabs',
                        tabsMode: 'line',
                        className: 'm-t-lg',
                        tabs: [
                            {
                                title: '概览',
                                tab: [
                                    {
                                        type: 'grid',
                                        columns: [
                                            {
                                                md: 6,
                                                body: [
                                                    {
                                                        type: 'card',
                                                        header: {
                                                            title: '总支出',
                                                            subTitle: '本月'
                                                        },
                                                        body: {
                                                            type: 'tpl',
                                                            tpl: '<div style="font-size: 32px; font-weight: bold; color: #1890ff;">¥12,345.67</div>'
                                                        }
                                                    }
                                                ]
                                            },
                                            {
                                                md: 6,
                                                body: [
                                                    {
                                                        type: 'card',
                                                        header: {
                                                            title: '总收入',
                                                            subTitle: '本月'
                                                        },
                                                        body: {
                                                            type: 'tpl',
                                                            tpl: '<div style="font-size: 32px; font-weight: bold; color: #52c41a;">¥8,901.23</div>'
                                                        }
                                                    }
                                                ]
                                            }
                                        ]
                                    },
                                    {
                                        type: 'html',
                                        html: '<div id="chart-trend" style="width: 100%; height: 400px; margin-top: 20px;"></div>'
                                    }
                                ]
                            },
                            {
                                title: '分类统计',
                                tab: [
                                    {
                                        type: 'grid',
                                        columns: [
                                            {
                                                md: 6,
                                                body: [
                                                    {
                                                        type: 'html',
                                                        html: '<div id="chart-expense" style="width: 100%; height: 400px;"></div>'
                                                    }
                                                ]
                                            },
                                            {
                                                md: 6,
                                                body: [
                                                    {
                                                        type: 'html',
                                                        html: '<div id="chart-income" style="width: 100%; height: 400px;"></div>'
                                                    }
                                                ]
                                            }
                                        ]
                                    }
                                ]
                            },
                            {
                                title: '趋势分析',
                                tab: [
                                    {
                                        type: 'html',
                                        html: '<div id="chart-bar" style="width: 100%; height: 400px;"></div>'
                                    }
                                ]
                            }
                        ]
                    }
                ]
            });

            // 页面加载完成后初始化图表
            setTimeout(initCharts, 500);
        }

        // 页面加载完成后初始化应用
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>

</html>
