[project]
name = "zaccount"
version = "0.1.0"
description = "A local-first interactive report generator for a CSV ledger"
authors = [{ name = "zweix123", email = "1****************@user.noreply.gitee.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "commentjson>=0.9.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "rich>=14.0.0",
    "types-openpyxl>=3.1.5.20250919",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
